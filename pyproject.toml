[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rundown"
version = "0.3.0"
description = "A sleek, scalable overview of a pandas DataFrame: margin histograms, top values, sparklines"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lucas Durand", email = "lucas@lucasdurand.xyz" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy",
    "pandas>=1.5",
]

[project.urls]
Homepage = "https://github.com/lucasdurand/rundown"

[dependency-groups]
dev = [
    "jupyter>=1.1",
    "pandas>=3.0",
    "pytest>=8",
    "seaborn>=0.13",
]

[tool.setuptools]
packages = ["rundown"]

[tool.setuptools.package-data]
rundown = ["assets/*"]
